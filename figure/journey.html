<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The trip of one file</title>
<style>
  :root {
    --paper: #f2f2ef;
    --card: #fbfbfa;
    --ink: #26262a;
    --muted: #8c8c90;
    --rule: #d4d4d6;
    --face: #ffffff;
    --top: #f7f7f4;
    --shade: #dcdcd9;
    --accent: #3e63dd;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    overflow: hidden;
  }
  #stage { position: relative; width: 100vw; height: 100vh; }
  canvas { display: block; width: 100%; height: 100%; }

  .label {
    position: absolute;
    transform: translate(-50%, -100%);
    font-size: 12.5px;
    line-height: 1.28;
    letter-spacing: 0.01em;
    white-space: nowrap;
    pointer-events: none;
    text-align: center;
    text-shadow:
      0 1px 0 var(--paper),
      0 -1px 0 var(--paper),
      1px 0 0 var(--paper),
      -1px 0 0 var(--paper),
      0 0 6px var(--paper);
  }
  .label b { display: block; font-weight: 600; }
  .label span { color: var(--muted); font-size: 11.5px; }
  .label--zone b { font-size: 12.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink); }
  .label--zone span { display: none; }
  .label--key b { font-weight: 600; }
  .label--wall b {
    font-weight: 600;
    color: var(--ink);
    border-top: 1px solid var(--rule);
    padding-top: 3px;
  }
  .label--wall span { display: block; max-width: 15ch; white-space: normal; }
  @media (max-width: 640px) {
    .label { font-size: 10px; line-height: 1.2; }
    .label span { font-size: 9px; }
    .label--zone b { font-size: 10px; }
    .label--wall span { display: none; }
    .back { top: 12px; left: 12px; padding: 6px 10px; font-size: 11px; }
    .plate { flex-direction: column; align-items: flex-start; gap: 8px; padding: 10px 14px 12px; }
    .readout { font-size: 11px; }
    .hint { text-align: left; }
  }

  .plate {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 24px;
    padding: 14px 22px 16px;
    border-top: 1px solid var(--rule);
    background: linear-gradient(to top, var(--paper) 60%, transparent);
    pointer-events: none;
  }
  .readout {
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--ink);
    max-width: 68ch;
  }
  .readout em { font-style: normal; color: var(--muted); }
  .hint {
    font-size: 11px;
    color: var(--muted);
    text-align: right;
    white-space: nowrap;
  }
  .steps { display: flex; gap: 6px; }
  .steps i {
    width: 22px; height: 3px;
    background: var(--rule);
    display: block;
  }
  .steps i.on { background: var(--ink); }
  .back {
    position: absolute;
    top: 20px;
    left: 24px;
    z-index: 2;
    padding: 8px 12px;
    border: 1px solid var(--ink);
    background: var(--paper);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 12.5px;
    text-decoration: none;
  }
  .back:hover { background: var(--ink); color: var(--paper); }
  .back:active { background: var(--card); color: var(--ink); }
  /* The grain of the paper, over the whole drawing. */
  .grain {
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
    opacity: 0.5;
    mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='0.3'/></svg>");
  }
</style>
</head>
<body>
  <div id="stage">
    <a class="back" href="../index.html">Back to the sign in page</a>
    <div id="labels"></div>
    <div class="plate">
      <div class="readout" id="readout"></div>
      <div class="hint">
        <div class="steps" id="steps"></div>
        <div style="margin-top:6px">drag to look around</div>
      </div>
    </div>
    <div class="grain"></div>
  </div>
  <script type="module" src="journey.js"></script>
</body>
</html>
