<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The trip of one file</title>
<style>
  :root {
    --paper: #f2f2ef;
    --card: #fbfbfa;
    --ink: #26262a;
    --muted: #8c8c90;
    --rule: #d4d4d6;
    --face: #ffffff;
    --top: #f7f7f4;
    --shade: #dcdcd9;
    --accent: #3e63dd;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --sans: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    overflow: hidden;
  }
  #stage { position: relative; width: 100vw; height: 100vh; }
  canvas { display: block; width: 100%; height: 100%; }

  .label {
    position: absolute;
    transform: translate(-50%, -100%);
    font-size: 13px;
    line-height: 1.3;
    letter-spacing: 0.01em;
    white-space: nowrap;
    pointer-events: none;
    text-align: center;
  }
  .label b { display: block; font-weight: 600; }
  .label span { color: var(--muted); font-size: 12px; }
  .label--zone b { font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink); }
  .label--zone span { display: none; }
  .label--key b { font-weight: 600; }
  .label--wall b {
    font-weight: 600;
    color: var(--ink);
    border-top: 1px solid var(--rule);
    padding-top: 4px;
  }
  .label--wall span { display: block; max-width: 16ch; white-space: normal; }

  .plate {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 24px;
    padding: 14px 22px 16px;
    border-top: 1px solid var(--rule);
    background: linear-gradient(to top, var(--paper) 60%, transparent);
    pointer-events: none;
  }
  .readout {
    font-family: var(--mono);
    font-size: 12.5px;
    color: var(--ink);
    max-width: 68ch;
  }
  .readout em { font-style: normal; color: var(--muted); }
  .hint {
    font-size: 11px;
    color: var(--muted);
    text-align: right;
    white-space: nowrap;
  }
  .steps { display: flex; gap: 6px; }
  .steps i {
    width: 22px; height: 3px;
    background: var(--rule);
    display: block;
  }
  .steps i.on { background: var(--ink); }
</style>
</head>
<body>
  <div id="stage">
    <div id="labels"></div>
    <div class="plate">
      <div class="readout" id="readout"></div>
      <div class="hint">
        <div class="steps" id="steps"></div>
        <div style="margin-top:6px">drag to look around</div>
      </div>
    </div>
  </div>
  <script type="module" src="journey.js"></script>
</body>
</html>
