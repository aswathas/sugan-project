<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" viewBox="0 0 1200 675"><style>:root{--bg:#ffffff;--surface:#f8fafc;--border:#cbd5e1;--text:#0f172a;--muted:#475569;--arrow:#334155;--primary:#1d4ed8;--primary-bg:#eff6ff;--primary-border:#93c5fd;--accent:#0f766e;--accent-bg:#f0fdfa;--accent-border:#5eead4;--server:#334155;--server-bg:#f1f5f9;--warn:#b91c1c;--warn-bg:#fef2f2;--warn-border:#fca5a5}text{font-family:Inter,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif;fill:var(--text)}.title{font-size:25px;font-weight:700}.subtitle{font-size:14px;font-weight:400;fill:var(--muted)}.col-header{font-size:16px;font-weight:700;fill:#fff}.box-title{font-size:14.5px;font-weight:700}.arrow-label,.box-sub{font-size:12.5px}.box-sub{font-weight:400;fill:var(--muted)}.arrow-label{font-weight:600;fill:var(--text)}.label-primary{fill:var(--primary)}.label-primary-dark{fill:#1e3a8a}.label-accent{fill:var(--accent)}.badge-title{font-size:13.5px;font-weight:700;fill:var(--warn)}.badge-sub{font-size:12.5px;font-weight:600;fill:var(--text)}</style><defs><marker id="arrow-primary" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path fill="#1d4ed8" d="M 1 1.5 L 9 5 L 1 8.5 z"/></marker><marker id="arrow-accent" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path fill="#0f766e" d="M 1 1.5 L 9 5 L 1 8.5 z"/></marker><marker id="arrow-neutral" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path fill="#334155" d="M 1 1.5 L 9 5 L 1 8.5 z"/></marker></defs><rect width="1200" height="675" x="0" y="0" fill="var(--bg)"/><text x="48" y="46" class="title">Logical Architecture of the Secure File-Sharing System</text><text x="48" y="70" class="subtitle">End-to-end encryption runs in the browsers; the server stores only ciphertext, IVs, wrapped keys, and public keys.</text><line x1="48" x2="1152" y1="86" y2="86" stroke="var(--border)" stroke-width="1"/><rect width="280" height="534" x="48" y="106" fill="var(--primary-bg)" stroke="var(--primary-border)" stroke-width="1.5" rx="10"/><path fill="var(--primary)" d="M 48 116 Q 48 106 58 106 L 318 106 Q 328 106 328 116 L 328 148 L 48 148 Z"/><text x="188" y="133" class="col-header" text-anchor="middle">Sender&apos;s Browser</text><rect width="240" height="84" x="68" y="168" fill="#fff" stroke="var(--primary-border)" stroke-width="1.5" rx="8"/><text x="188" y="192" class="box-title" text-anchor="middle">Key Pair (RSA-OAEP)</text><text x="188" y="214" class="box-sub" text-anchor="middle">Private key stored in IndexedDB</text><text x="188" y="234" class="box-sub" text-anchor="middle">Public key published to server</text><rect width="240" height="68" x="68" y="274" fill="#fff" stroke="var(--primary-border)" stroke-width="1.5" rx="8"/><text x="188" y="299" class="box-title" text-anchor="middle">File Selected</text><text x="188" y="321" class="box-sub" text-anchor="middle">Plaintext held in browser memory</text><line x1="188" x2="188" y1="342" y2="362" stroke="var(--primary)" stroke-width="2" marker-end="url(#arrow-primary)"/><rect width="240" height="84" x="68" y="366" fill="#fff" stroke="var(--primary-border)" stroke-width="1.5" rx="8"/><text x="188" y="390" class="box-title" text-anchor="middle">AES-GCM Encryption</text><text x="188" y="412" class="box-sub" text-anchor="middle">Fresh 256-bit key + random 96-bit IV</text><text x="188" y="432" class="box-sub" text-anchor="middle">Encrypts file to ciphertext</text><line x1="188" x2="188" y1="450" y2="470" stroke="var(--primary)" stroke-width="2" marker-end="url(#arrow-primary)"/><rect width="240" height="90" x="68" y="474" fill="#fff" stroke="var(--primary-border)" stroke-width="1.5" rx="8"/><text x="188" y="498" class="box-title" text-anchor="middle">RSA-OAEP Key Wrapping</text><text x="188" y="520" class="box-sub" text-anchor="middle">Encrypts AES key using</text><text x="188" y="540" class="box-sub" text-anchor="middle">recipient&apos;s public key</text><rect width="240" height="38" x="68" y="582" fill="#dbeafe" stroke="var(--primary-border)" stroke-width="1" rx="6"/><text x="188" y="605" class="arrow-label label-primary-dark" text-anchor="middle">Plaintext never leaves sender</text><rect width="280" height="534" x="460" y="106" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5" rx="10"/><path fill="var(--server)" d="M 460 116 Q 460 106 470 106 L 730 106 Q 740 106 740 116 L 740 148 L 460 148 Z"/><text x="600" y="133" class="col-header" text-anchor="middle">Server</text><rect width="240" height="84" x="480" y="168" fill="#fff" stroke="var(--border)" stroke-width="1.5" rx="8"/><text x="600" y="193" class="box-title" text-anchor="middle">Accounts and Public Keys</text><text x="600" y="215" class="box-sub" text-anchor="middle">User credentials, OTP verification,</text><text x="600" y="234" class="box-sub" text-anchor="middle">and published SPKI public keys</text><rect width="240" height="92" x="480" y="274" fill="#fff" stroke="var(--border)" stroke-width="1.5" rx="8"/><text x="600" y="299" class="box-title" text-anchor="middle">Share Metadata</text><text x="600" y="321" class="box-sub" text-anchor="middle">Sender, recipient, filename,</text><text x="600" y="340" class="box-sub" text-anchor="middle">IV, wrapped key, view/download rule</text><rect width="240" height="82" x="480" y="388" fill="#fff" stroke="var(--border)" stroke-width="1.5" rx="8"/><text x="600" y="414" class="box-title" text-anchor="middle">Ciphertext Blobs</text><text x="600" y="436" class="box-sub" text-anchor="middle">Encrypted file bytes on disk</text><text x="600" y="455" class="box-sub" text-anchor="middle">Opaque to the server</text><rect width="240" height="126" x="480" y="494" fill="var(--warn-bg)" stroke="var(--warn)" stroke-dasharray="6 3" stroke-width="1.5" rx="8"/><text x="600" y="520" class="badge-title" text-anchor="middle">Zero Plaintext Boundary</text><text x="600" y="544" class="badge-sub" text-anchor="middle">Server NEVER holds:</text><text x="600" y="568" class="box-sub" text-anchor="middle">• Plaintext file</text><text x="600" y="588" class="box-sub" text-anchor="middle">• User private key</text><text x="600" y="608" class="box-sub" text-anchor="middle">• Unwrapped AES-GCM key</text><rect width="280" height="534" x="872" y="106" fill="var(--accent-bg)" stroke="var(--accent-border)" stroke-width="1.5" rx="10"/><path fill="var(--accent)" d="M 872 116 Q 872 106 882 106 L 1142 106 Q 1152 106 1152 116 L 1152 148 L 872 148 Z"/><text x="1012" y="133" class="col-header" text-anchor="middle">Recipient&apos;s Browser</text><rect width="240" height="84" x="892" y="168" fill="#fff" stroke="var(--accent-border)" stroke-width="1.5" rx="8"/><text x="1012" y="193" class="box-title" text-anchor="middle">Private Key from IndexedDB</text><text x="1012" y="215" class="box-sub" text-anchor="middle">Non-extractable RSA-OAEP key</text><text x="1012" y="234" class="box-sub" text-anchor="middle">Loaded locally on device</text><line x1="1012" x2="1012" y1="252" y2="274" stroke="var(--accent)" stroke-width="2" marker-end="url(#arrow-accent)"/><rect width="240" height="86" x="892" y="278" fill="#fff" stroke="var(--accent-border)" stroke-width="1.5" rx="8"/><text x="1012" y="303" class="box-title" text-anchor="middle">Unwrap AES Key</text><text x="1012" y="325" class="box-sub" text-anchor="middle">Decrypts wrapped key using</text><text x="1012" y="344" class="box-sub" text-anchor="middle">recipient&apos;s private key</text><line x1="1012" x2="1012" y1="364" y2="386" stroke="var(--accent)" stroke-width="2" marker-end="url(#arrow-accent)"/><rect width="240" height="86" x="892" y="390" fill="#fff" stroke="var(--accent-border)" stroke-width="1.5" rx="8"/><text x="1012" y="415" class="box-title" text-anchor="middle">Decrypt File</text><text x="1012" y="437" class="box-sub" text-anchor="middle">AES-GCM decrypts ciphertext</text><text x="1012" y="456" class="box-sub" text-anchor="middle">with AES key and IV</text><line x1="1012" x2="1012" y1="476" y2="498" stroke="var(--accent)" stroke-width="2" marker-end="url(#arrow-accent)"/><rect width="240" height="84" x="892" y="502" fill="#fff" stroke="var(--accent-border)" stroke-width="1.5" rx="8"/><text x="1012" y="527" class="box-title" text-anchor="middle">Download / View</text><text x="1012" y="549" class="box-sub" text-anchor="middle">Plaintext restored in browser</text><text x="1012" y="568" class="box-sub" text-anchor="middle">Saved or opened per permission</text><line x1="460" x2="332" y1="210" y2="210" stroke="var(--arrow)" stroke-dasharray="6 4" stroke-width="2" marker-end="url(#arrow-neutral)"/><text x="394" y="190" class="arrow-label" text-anchor="middle">recipient&apos;s</text><text x="394" y="204" class="arrow-label" text-anchor="middle">public key</text><line x1="328" x2="456" y1="432" y2="432" stroke="var(--primary)" stroke-width="2.5" marker-end="url(#arrow-primary)"/><text x="394" y="405" class="arrow-label label-primary" text-anchor="middle">ciphertext, IV,</text><text x="394" y="422" class="arrow-label label-primary" text-anchor="middle">wrapped key</text><line x1="872" x2="744" y1="320" y2="320" stroke="var(--arrow)" stroke-dasharray="6 4" stroke-width="2" marker-end="url(#arrow-neutral)"/><text x="806" y="299" class="arrow-label" text-anchor="middle">authenticated</text><text x="806" y="313" class="arrow-label" text-anchor="middle">share request</text><line x1="740" x2="868" y1="432" y2="432" stroke="var(--accent)" stroke-width="2.5" marker-end="url(#arrow-accent)"/><text x="806" y="421" class="arrow-label label-accent" text-anchor="middle">ciphertext only</text><text x="806" y="451" class="box-sub" text-anchor="middle">(+ IV, wrapped key)</text></svg>