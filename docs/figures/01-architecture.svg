<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f8fafc;
      --border: #cbd5e1;
      --text: #0f172a;
      --muted: #475569;
      --arrow: #334155;
      --primary: #1d4ed8;
      --primary-bg: #eff6ff;
      --primary-border: #93c5fd;
      --accent: #0f766e;
      --accent-bg: #f0fdfa;
      --accent-border: #5eead4;
      --server: #334155;
      --server-bg: #f1f5f9;
      --warn: #b91c1c;
      --warn-bg: #fef2f2;
      --warn-border: #fca5a5;
    }
    text {
      font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif;
      fill: var(--text);
    }
    .title { font-size: 25px; font-weight: 700; }
    .subtitle { font-size: 14px; font-weight: 400; fill: var(--muted); }
    .col-header { font-size: 16px; font-weight: 700; fill: #ffffff; }
    .box-title { font-size: 14.5px; font-weight: 700; }
    .box-sub { font-size: 12.5px; font-weight: 400; fill: var(--muted); }
    .arrow-label { font-size: 12.5px; font-weight: 600; fill: var(--text); }
    .label-primary { fill: var(--primary); }
    .label-primary-dark { fill: #1e3a8a; }
    .label-accent { fill: var(--accent); }
    .badge-title { font-size: 13.5px; font-weight: 700; fill: var(--warn); }
    .badge-sub { font-size: 12.5px; font-weight: 600; fill: var(--text); }
  </style>

  <defs>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-neutral" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1200" height="675" fill="var(--bg)"/>

  <!-- Header -->
  <text x="48" y="46" class="title">Logical Architecture of the Secure File-Sharing System</text>
  <text x="48" y="70" class="subtitle">End-to-end encryption runs in the browsers; the server stores only ciphertext, IVs, wrapped keys, and public keys.</text>
  <line x1="48" y1="86" x2="1152" y2="86" stroke="var(--border)" stroke-width="1"/>

  <!-- Column 1: Sender's browser -->
  <rect x="48" y="106" width="280" height="534" rx="10" fill="var(--primary-bg)" stroke="var(--primary-border)" stroke-width="1.5"/>
  <path d="M 48 116 Q 48 106 58 106 L 318 106 Q 328 106 328 116 L 328 148 L 48 148 Z" fill="var(--primary)"/>
  <text x="188" y="133" text-anchor="middle" class="col-header">Sender's Browser</text>

  <rect x="68" y="168" width="240" height="84" rx="8" fill="#ffffff" stroke="var(--primary-border)" stroke-width="1.5"/>
  <text x="188" y="192" text-anchor="middle" class="box-title">Key Pair (RSA-OAEP)</text>
  <text x="188" y="214" text-anchor="middle" class="box-sub">Private key stored in IndexedDB</text>
  <text x="188" y="234" text-anchor="middle" class="box-sub">Public key published to server</text>

  <rect x="68" y="274" width="240" height="68" rx="8" fill="#ffffff" stroke="var(--primary-border)" stroke-width="1.5"/>
  <text x="188" y="299" text-anchor="middle" class="box-title">File Selected</text>
  <text x="188" y="321" text-anchor="middle" class="box-sub">Plaintext held in browser memory</text>

  <line x1="188" y1="342" x2="188" y2="362" stroke="var(--primary)" stroke-width="2" marker-end="url(#arrow-primary)"/>

  <rect x="68" y="366" width="240" height="84" rx="8" fill="#ffffff" stroke="var(--primary-border)" stroke-width="1.5"/>
  <text x="188" y="390" text-anchor="middle" class="box-title">AES-GCM Encryption</text>
  <text x="188" y="412" text-anchor="middle" class="box-sub">Fresh 256-bit key + random 96-bit IV</text>
  <text x="188" y="432" text-anchor="middle" class="box-sub">Encrypts file to ciphertext</text>

  <line x1="188" y1="450" x2="188" y2="470" stroke="var(--primary)" stroke-width="2" marker-end="url(#arrow-primary)"/>

  <rect x="68" y="474" width="240" height="90" rx="8" fill="#ffffff" stroke="var(--primary-border)" stroke-width="1.5"/>
  <text x="188" y="498" text-anchor="middle" class="box-title">RSA-OAEP Key Wrapping</text>
  <text x="188" y="520" text-anchor="middle" class="box-sub">Encrypts AES key using</text>
  <text x="188" y="540" text-anchor="middle" class="box-sub">recipient's public key</text>

  <rect x="68" y="582" width="240" height="38" rx="6" fill="#dbeafe" stroke="var(--primary-border)" stroke-width="1"/>
  <text x="188" y="605" text-anchor="middle" class="arrow-label label-primary-dark">Plaintext never leaves sender</text>

  <!-- Column 2: Server -->
  <rect x="460" y="106" width="280" height="534" rx="10" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5"/>
  <path d="M 460 116 Q 460 106 470 106 L 730 106 Q 740 106 740 116 L 740 148 L 460 148 Z" fill="var(--server)"/>
  <text x="600" y="133" text-anchor="middle" class="col-header">Server</text>

  <rect x="480" y="168" width="240" height="84" rx="8" fill="#ffffff" stroke="var(--border)" stroke-width="1.5"/>
  <text x="600" y="193" text-anchor="middle" class="box-title">Accounts and Public Keys</text>
  <text x="600" y="215" text-anchor="middle" class="box-sub">User credentials, OTP verification,</text>
  <text x="600" y="234" text-anchor="middle" class="box-sub">and published SPKI public keys</text>

  <rect x="480" y="274" width="240" height="92" rx="8" fill="#ffffff" stroke="var(--border)" stroke-width="1.5"/>
  <text x="600" y="299" text-anchor="middle" class="box-title">Share Metadata</text>
  <text x="600" y="321" text-anchor="middle" class="box-sub">Sender, recipient, filename,</text>
  <text x="600" y="340" text-anchor="middle" class="box-sub">IV, wrapped key, view/download rule</text>

  <rect x="480" y="388" width="240" height="82" rx="8" fill="#ffffff" stroke="var(--border)" stroke-width="1.5"/>
  <text x="600" y="414" text-anchor="middle" class="box-title">Ciphertext Blobs</text>
  <text x="600" y="436" text-anchor="middle" class="box-sub">Encrypted file bytes on disk</text>
  <text x="600" y="455" text-anchor="middle" class="box-sub">Opaque to the server</text>

  <!-- Clear security marker on Server box -->
  <rect x="480" y="494" width="240" height="126" rx="8" fill="var(--warn-bg)" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="600" y="520" text-anchor="middle" class="badge-title">Zero Plaintext Boundary</text>
  <text x="600" y="544" text-anchor="middle" class="badge-sub">Server NEVER holds:</text>
  <text x="600" y="568" text-anchor="middle" class="box-sub">• Plaintext file</text>
  <text x="600" y="588" text-anchor="middle" class="box-sub">• User private key</text>
  <text x="600" y="608" text-anchor="middle" class="box-sub">• Unwrapped AES-GCM key</text>

  <!-- Column 3: Recipient's browser -->
  <rect x="872" y="106" width="280" height="534" rx="10" fill="var(--accent-bg)" stroke="var(--accent-border)" stroke-width="1.5"/>
  <path d="M 872 116 Q 872 106 882 106 L 1142 106 Q 1152 106 1152 116 L 1152 148 L 872 148 Z" fill="var(--accent)"/>
  <text x="1012" y="133" text-anchor="middle" class="col-header">Recipient's Browser</text>

  <rect x="892" y="168" width="240" height="84" rx="8" fill="#ffffff" stroke="var(--accent-border)" stroke-width="1.5"/>
  <text x="1012" y="193" text-anchor="middle" class="box-title">Private Key from IndexedDB</text>
  <text x="1012" y="215" text-anchor="middle" class="box-sub">Non-extractable RSA-OAEP key</text>
  <text x="1012" y="234" text-anchor="middle" class="box-sub">Loaded locally on device</text>

  <line x1="1012" y1="252" x2="1012" y2="274" stroke="var(--accent)" stroke-width="2" marker-end="url(#arrow-accent)"/>

  <rect x="892" y="278" width="240" height="86" rx="8" fill="#ffffff" stroke="var(--accent-border)" stroke-width="1.5"/>
  <text x="1012" y="303" text-anchor="middle" class="box-title">Unwrap AES Key</text>
  <text x="1012" y="325" text-anchor="middle" class="box-sub">Decrypts wrapped key using</text>
  <text x="1012" y="344" text-anchor="middle" class="box-sub">recipient's private key</text>

  <line x1="1012" y1="364" x2="1012" y2="386" stroke="var(--accent)" stroke-width="2" marker-end="url(#arrow-accent)"/>

  <rect x="892" y="390" width="240" height="86" rx="8" fill="#ffffff" stroke="var(--accent-border)" stroke-width="1.5"/>
  <text x="1012" y="415" text-anchor="middle" class="box-title">Decrypt File</text>
  <text x="1012" y="437" text-anchor="middle" class="box-sub">AES-GCM decrypts ciphertext</text>
  <text x="1012" y="456" text-anchor="middle" class="box-sub">with AES key and IV</text>

  <line x1="1012" y1="476" x2="1012" y2="498" stroke="var(--accent)" stroke-width="2" marker-end="url(#arrow-accent)"/>

  <rect x="892" y="502" width="240" height="84" rx="8" fill="#ffffff" stroke="var(--accent-border)" stroke-width="1.5"/>
  <text x="1012" y="527" text-anchor="middle" class="box-title">Download / View</text>
  <text x="1012" y="549" text-anchor="middle" class="box-sub">Plaintext restored in browser</text>
  <text x="1012" y="568" text-anchor="middle" class="box-sub">Saved or opened per permission</text>

  <!-- Inter-column Arrows: Sender <-> Server -->
  <!-- Return arrow: Server -> Sender (recipient's public key) -->
  <line x1="460" y1="210" x2="332" y2="210" stroke="var(--arrow)" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-neutral)"/>
  <text x="394" y="190" text-anchor="middle" class="arrow-label">recipient's</text>
  <text x="394" y="204" text-anchor="middle" class="arrow-label">public key</text>

  <!-- Forward arrow: Sender -> Server (ciphertext, IV, wrapped key) -->
  <line x1="328" y1="432" x2="456" y2="432" stroke="var(--primary)" stroke-width="2.5" marker-end="url(#arrow-primary)"/>
  <text x="394" y="405" text-anchor="middle" class="arrow-label label-primary">ciphertext, IV,</text>
  <text x="394" y="422" text-anchor="middle" class="arrow-label label-primary">wrapped key</text>

  <!-- Inter-column Arrows: Server <-> Recipient -->
  <!-- Return arrow: Recipient -> Server (authenticated fetch) -->
  <line x1="872" y1="320" x2="744" y2="320" stroke="var(--arrow)" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-neutral)"/>
  <text x="806" y="299" text-anchor="middle" class="arrow-label">authenticated</text>
  <text x="806" y="313" text-anchor="middle" class="arrow-label">share request</text>

  <!-- Forward arrow: Server -> Recipient (ciphertext only) -->
  <line x1="740" y1="432" x2="868" y2="432" stroke="var(--accent)" stroke-width="2.5" marker-end="url(#arrow-accent)"/>
  <text x="806" y="421" text-anchor="middle" class="arrow-label label-accent">ciphertext only</text>
  <text x="806" y="451" text-anchor="middle" class="box-sub">(+ IV, wrapped key)</text>
</svg>
