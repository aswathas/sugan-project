<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" viewBox="0 0 1200 675"><style>:root{--bg:#ffffff;--surface:#f8fafc;--border:#cbd5e1;--text:#0f172a;--muted:#475569;--arrow:#334155;--primary:#1d4ed8;--primary-bg:#eff6ff;--primary-border:#93c5fd;--accent:#0f766e;--accent-bg:#f0fdfa;--accent-border:#5eead4;--server:#334155;--warn:#b91c1c;--warn-bg:#fef2f2;--warn-border:#fca5a5}text{font-family:Inter,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif;fill:var(--text)}.title{font-size:25px;font-weight:700}.subtitle{font-size:14px;font-weight:400;fill:var(--muted)}.zone-title{font-size:15.5px;font-weight:700;fill:#fff}.box-title{font-size:14px;font-weight:700}.arrow-label,.box-sub{font-size:12px}.box-sub{font-weight:400;fill:var(--muted)}.arrow-label{font-weight:600;fill:var(--text)}.label-primary{fill:var(--primary)}.label-accent{fill:var(--accent)}.boundary-label{font-size:13px;font-weight:700;fill:var(--warn)}.key-pill,.key-pill-accent{font-size:12px;font-weight:700;fill:var(--primary)}.key-pill-accent{fill:var(--accent)}</style><defs><marker id="arrow-primary" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path fill="#1d4ed8" d="M 1 1.5 L 9 5 L 1 8.5 z"/></marker><marker id="arrow-accent" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path fill="#0f766e" d="M 1 1.5 L 9 5 L 1 8.5 z"/></marker><marker id="arrow-neutral" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path fill="#334155" d="M 1 1.5 L 9 5 L 1 8.5 z"/></marker></defs><rect width="1200" height="675" x="0" y="0" fill="var(--bg)"/><text x="48" y="46" class="title">How End-to-End Encryption Works for One Share</text><text x="48" y="70" class="subtitle">The file is encrypted with a fresh AES-GCM key; only the recipient&apos;s RSA-OAEP public key wraps that AES key.</text><line x1="48" x2="1152" y1="86" y2="86" stroke="var(--border)" stroke-width="1"/><rect width="412" height="516" x="48" y="108" fill="var(--primary-bg)" stroke="var(--primary-border)" stroke-width="1.5" rx="10"/><path fill="var(--primary)" d="M 48 118 Q 48 108 58 108 L 450 108 Q 460 108 460 118 L 460 148 L 48 148 Z"/><text x="254" y="134" class="zone-title" text-anchor="middle">Sender&apos;s Browser</text><rect width="236" height="516" x="482" y="108" fill="var(--surface)" stroke="var(--warn)" stroke-dasharray="7 4" stroke-width="2" rx="10"/><rect width="212" height="50" x="494" y="120" fill="var(--warn-bg)" stroke="var(--warn-border)" stroke-width="1" rx="6"/><text x="600" y="141" class="boundary-label" text-anchor="middle">The server never sees the</text><text x="600" y="159" class="boundary-label" text-anchor="middle">plaintext file or the AES key</text><rect width="412" height="516" x="740" y="108" fill="var(--accent-bg)" stroke="var(--accent-border)" stroke-width="1.5" rx="10"/><path fill="var(--accent)" d="M 740 118 Q 740 108 750 108 L 1142 108 Q 1152 108 1152 118 L 1152 148 L 740 148 Z"/><text x="946" y="134" class="zone-title" text-anchor="middle">Recipient&apos;s Browser</text><rect width="84" height="86" x="62" y="218" fill="var(--warn-bg)" stroke="var(--warn)" stroke-width="1.5" rx="8"/><text x="104" y="254" class="box-title" text-anchor="middle">Plain PDF</text><text x="104" y="276" class="box-sub" text-anchor="middle">(plaintext)</text><line x1="146" x2="168" y1="261" y2="261" stroke="var(--primary)" stroke-width="2.2" marker-end="url(#arrow-primary)"/><rect width="150" height="114" x="172" y="204" fill="#fff" stroke="var(--primary-border)" stroke-width="1.5" rx="8"/><text x="247" y="230" class="box-title" text-anchor="middle">AES-GCM</text><text x="247" y="248" class="box-title" text-anchor="middle">Encryption</text><text x="247" y="274" class="box-sub" text-anchor="middle">Fresh 256-bit key</text><text x="247" y="294" class="box-sub" text-anchor="middle">Random 96-bit IV</text><line x1="322" x2="346" y1="261" y2="261" stroke="var(--primary)" stroke-width="2.2" marker-end="url(#arrow-primary)"/><rect width="96" height="86" x="350" y="218" fill="#fff" stroke="var(--primary-border)" stroke-width="1.5" rx="8"/><text x="398" y="254" class="box-title" text-anchor="middle">Ciphertext</text><text x="398" y="276" class="box-sub" text-anchor="middle">(+ 96-bit IV)</text><line x1="247" x2="247" y1="318" y2="394" stroke="var(--primary)" stroke-width="2.2" marker-end="url(#arrow-primary)"/><rect width="114" height="22" x="190" y="343" fill="#dbeafe" rx="4"/><text x="247" y="358" class="key-pill" text-anchor="middle">256-bit AES key</text><rect width="150" height="108" x="172" y="398" fill="#fff" stroke="var(--primary-border)" stroke-width="1.5" rx="8"/><text x="247" y="424" class="box-title" text-anchor="middle">RSA-OAEP Wrap</text><text x="247" y="448" class="box-sub" text-anchor="middle">Encrypts AES key with</text><text x="247" y="466" class="box-sub" text-anchor="middle">recipient&apos;s public key</text><line x1="322" x2="346" y1="452" y2="452" stroke="var(--primary)" stroke-width="2.2" marker-end="url(#arrow-primary)"/><rect width="96" height="88" x="350" y="408" fill="#fff" stroke="var(--primary-border)" stroke-width="1.5" rx="8"/><text x="398" y="446" class="box-title" text-anchor="middle">Wrapped</text><text x="398" y="464" class="box-title" text-anchor="middle">Key</text><rect width="164" height="320" x="518" y="198" fill="#fff" stroke="var(--border)" stroke-width="1.5" rx="8"/><path fill="var(--server)" d="M 518 206 Q 518 198 526 198 L 674 198 Q 682 198 682 206 L 682 232 L 518 232 Z"/><text x="600" y="220" class="arrow-label" text-anchor="middle" style="fill:#fff">Uploaded to Server</text><rect width="136" height="62" x="532" y="246" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/><text x="600" y="272" class="box-title" text-anchor="middle">Ciphertext</text><text x="600" y="292" class="box-sub" text-anchor="middle">+ 96-bit IV</text><text x="600" y="362" class="box-sub" text-anchor="middle">Stored on disk</text><text x="600" y="380" class="box-sub" text-anchor="middle">(cannot decrypt)</text><rect width="136" height="64" x="532" y="420" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/><text x="600" y="448" class="box-title" text-anchor="middle">Wrapped Key</text><text x="600" y="468" class="box-sub" text-anchor="middle">RSA-OAEP blob</text><line x1="446" x2="514" y1="261" y2="261" stroke="var(--primary)" stroke-width="2.2" marker-end="url(#arrow-primary)"/><rect width="48" height="20" x="458" y="232" fill="#fff" rx="4"/><text x="482" y="246" class="arrow-label label-primary" text-anchor="middle">upload</text><line x1="446" x2="514" y1="452" y2="452" stroke="var(--primary)" stroke-width="2.2" marker-end="url(#arrow-primary)"/><rect width="48" height="20" x="458" y="423" fill="#fff" rx="4"/><text x="482" y="437" class="arrow-label label-primary" text-anchor="middle">upload</text><line x1="682" x2="862" y1="261" y2="261" stroke="var(--accent)" stroke-width="2.2" marker-end="url(#arrow-accent)"/><rect width="134" height="32" x="708" y="226" fill="#fff" rx="4"/><text x="775" y="240" class="arrow-label label-accent" text-anchor="middle">back to recipient&apos;s</text><text x="775" y="254" class="arrow-label label-accent" text-anchor="middle">browser</text><line x1="682" x2="862" y1="452" y2="452" stroke="var(--accent)" stroke-width="2.2" marker-end="url(#arrow-accent)"/><rect width="110" height="22" x="720" y="424" fill="#fff" rx="4"/><text x="775" y="439" class="arrow-label label-accent" text-anchor="middle">wrapped key</text><rect width="150" height="114" x="866" y="204" fill="#fff" stroke="var(--accent-border)" stroke-width="1.5" rx="8"/><text x="941" y="232" class="box-title" text-anchor="middle">Decrypt</text><text x="941" y="250" class="box-title" text-anchor="middle">(AES-GCM)</text><text x="941" y="276" class="box-sub" text-anchor="middle">Uses unwrapped AES</text><text x="941" y="294" class="box-sub" text-anchor="middle">key + 96-bit IV</text><rect width="150" height="108" x="866" y="398" fill="#fff" stroke="var(--accent-border)" stroke-width="1.5" rx="8"/><text x="941" y="424" class="box-title" text-anchor="middle">Unwrap with</text><text x="941" y="442" class="box-title" text-anchor="middle">Private Key</text><text x="941" y="468" class="box-sub" text-anchor="middle">RSA-OAEP key loaded</text><text x="941" y="486" class="box-sub" text-anchor="middle">from IndexedDB</text><line x1="941" x2="941" y1="398" y2="322" stroke="var(--accent)" stroke-width="2.2" marker-end="url(#arrow-accent)"/><rect width="114" height="22" x="884" y="347" fill="#ccfbf1" rx="4"/><text x="941" y="362" class="key-pill-accent" text-anchor="middle">256-bit AES key</text><line x1="1016" x2="1044" y1="261" y2="261" stroke="var(--accent)" stroke-width="2.2" marker-end="url(#arrow-accent)"/><rect width="90" height="86" x="1048" y="218" fill="#fff" stroke="var(--accent)" stroke-width="2" rx="8"/><text x="1093" y="250" class="box-title" text-anchor="middle">Original</text><text x="1093" y="268" class="box-title" text-anchor="middle">PDF</text><text x="1093" y="290" class="box-sub" text-anchor="middle">(restored)</text><text x="254" y="562" class="box-sub" text-anchor="middle">Plaintext &amp; AES key stay inside sender&apos;s browser</text><text x="600" y="562" class="box-sub" text-anchor="middle">No private keys, no plaintext</text><text x="946" y="562" class="box-sub" text-anchor="middle">Only the intended recipient can decrypt</text></svg>