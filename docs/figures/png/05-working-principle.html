<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;padding:0;background:#ffffff}svg{display:block}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f8fafc;
      --border: #cbd5e1;
      --text: #0f172a;
      --muted: #475569;
      --arrow: #334155;
      --primary: #1d4ed8;
      --primary-bg: #eff6ff;
      --primary-border: #93c5fd;
      --accent: #0f766e;
      --accent-bg: #f0fdfa;
      --accent-border: #5eead4;
      --server: #334155;
      --server-bg: #f1f5f9;
      --server-border: #94a3b8;
      --warn: #b91c1c;
    }
    text {
      font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif;
      fill: var(--text);
    }
    .title { font-size: 25px; font-weight: 700; }
    .subtitle { font-size: 14px; font-weight: 400; fill: var(--muted); }
    .col-header { font-size: 16px; font-weight: 700; fill: #ffffff; }
    .step-num { font-size: 14px; font-weight: 700; fill: #ffffff; }
    .step-title { font-size: 14.5px; font-weight: 700; }
    .step-sub { font-size: 12.5px; font-weight: 400; fill: var(--muted); }
    .legend-title { font-size: 13.5px; font-weight: 700; fill: var(--text); }
    .legend-label { font-size: 13.5px; font-weight: 600; fill: var(--text); }
  </style>

  <defs>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-neutral" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1200" height="675" fill="var(--bg)"/>

  <!-- Header -->
  <text x="48" y="46" class="title">Seven-Step Working Principle</text>
  <text x="48" y="70" class="subtitle">End-to-end flow from sender registration and client-side encryption to recipient decryption and access.</text>
  <line x1="48" y1="86" x2="1152" y2="86" stroke="var(--border)" stroke-width="1"/>

  <!-- Zone 1: Sender's Browser -->
  <rect x="48" y="104" width="320" height="464" rx="10" fill="var(--primary-bg)" stroke="var(--primary-border)" stroke-width="1.5"/>
  <path d="M 48 114 Q 48 104 58 104 L 358 104 Q 368 104 368 114 L 368 144 L 48 144 Z" fill="var(--primary)"/>
  <text x="208" y="130" text-anchor="middle" class="col-header">Sender's Browser</text>

  <!-- Step 1 -->
  <rect x="68" y="162" width="280" height="110" rx="8" fill="#ffffff" stroke="var(--primary)" stroke-width="2"/>
  <circle cx="94" cy="190" r="14" fill="var(--primary)"/>
  <text x="94" y="195" text-anchor="middle" class="step-num">1</text>
  <text x="118" y="195" class="step-title">User Authentication</text>
  <text x="82" y="224" class="step-sub">Sign in via OAuth or email + OTP;</text>
  <text x="82" y="244" class="step-sub">generate RSA key pair in IndexedDB</text>

  <line x1="208" y1="272" x2="208" y2="296" stroke="var(--primary)" stroke-width="2.2" marker-end="url(#arrow-primary)"/>

  <!-- Step 2 -->
  <rect x="68" y="300" width="280" height="110" rx="8" fill="#ffffff" stroke="var(--primary)" stroke-width="2"/>
  <circle cx="94" cy="328" r="14" fill="var(--primary)"/>
  <text x="94" y="333" text-anchor="middle" class="step-num">2</text>
  <text x="118" y="333" class="step-title">File Selection and Upload</text>
  <text x="82" y="362" class="step-sub">Pick PDF in browser; choose target</text>
  <text x="82" y="382" class="step-sub">recipient and view/download access</text>

  <line x1="208" y1="410" x2="208" y2="434" stroke="var(--primary)" stroke-width="2.2" marker-end="url(#arrow-primary)"/>

  <!-- Step 3 -->
  <rect x="68" y="438" width="280" height="110" rx="8" fill="#ffffff" stroke="var(--primary)" stroke-width="2"/>
  <circle cx="94" cy="466" r="14" fill="var(--primary)"/>
  <text x="94" y="471" text-anchor="middle" class="step-num">3</text>
  <text x="118" y="471" class="step-title">Client-Side Encryption</text>
  <text x="82" y="500" class="step-sub">AES-GCM encrypts file; RSA-OAEP</text>
  <text x="82" y="520" class="step-sub">wraps AES key with public key</text>

  <!-- Zone 2: Server -->
  <rect x="440" y="104" width="320" height="464" rx="10" fill="var(--server-bg)" stroke="var(--server-border)" stroke-width="1.5"/>
  <path d="M 440 114 Q 440 104 450 104 L 750 104 Q 760 104 760 114 L 760 144 L 440 144 Z" fill="var(--server)"/>
  <text x="600" y="130" text-anchor="middle" class="col-header">Server</text>

  <!-- Step 4 -->
  <rect x="460" y="218" width="280" height="118" rx="8" fill="#ffffff" stroke="var(--server)" stroke-width="2"/>
  <circle cx="486" cy="246" r="14" fill="var(--server)"/>
  <text x="486" y="251" text-anchor="middle" class="step-num">4</text>
  <text x="510" y="251" class="step-title">Authorized Sharing</text>
  <text x="474" y="282" class="step-sub">Verify sender session; record share</text>
  <text x="474" y="302" class="step-sub">with ciphertext, IV, wrapped key &amp; rule</text>

  <line x1="600" y1="336" x2="600" y2="372" stroke="var(--server)" stroke-width="2.2" marker-end="url(#arrow-neutral)"/>

  <!-- Step 5 -->
  <rect x="460" y="376" width="280" height="118" rx="8" fill="#ffffff" stroke="var(--server)" stroke-width="2"/>
  <circle cx="486" cy="404" r="14" fill="var(--server)"/>
  <text x="486" y="409" text-anchor="middle" class="step-num">5</text>
  <text x="510" y="409" class="step-title">Secure Transmission</text>
  <text x="474" y="440" class="step-sub">Deliver encrypted blob and share</text>
  <text x="474" y="460" class="step-sub">metadata only to authorized recipient</text>

  <!-- Zone 3: Recipient's Browser -->
  <rect x="832" y="104" width="320" height="464" rx="10" fill="var(--accent-bg)" stroke="var(--accent-border)" stroke-width="1.5"/>
  <path d="M 832 114 Q 832 104 842 104 L 1142 104 Q 1152 104 1152 114 L 1152 144 L 832 144 Z" fill="var(--accent)"/>
  <text x="992" y="130" text-anchor="middle" class="col-header">Recipient's Browser</text>

  <!-- Step 6 -->
  <rect x="852" y="218" width="280" height="118" rx="8" fill="#ffffff" stroke="var(--accent)" stroke-width="2"/>
  <circle cx="878" cy="246" r="14" fill="var(--accent)"/>
  <text x="878" y="251" text-anchor="middle" class="step-num">6</text>
  <text x="902" y="251" class="step-title">Recipient Authentication</text>
  <text x="866" y="282" class="step-sub">Authenticate recipient session; load</text>
  <text x="866" y="302" class="step-sub">local private key from IndexedDB</text>

  <line x1="992" y1="336" x2="992" y2="372" stroke="var(--accent)" stroke-width="2.2" marker-end="url(#arrow-accent)"/>

  <!-- Step 7 -->
  <rect x="852" y="376" width="280" height="118" rx="8" fill="#ffffff" stroke="var(--accent)" stroke-width="2"/>
  <circle cx="878" cy="404" r="14" fill="var(--accent)"/>
  <text x="878" y="409" text-anchor="middle" class="step-num">7</text>
  <text x="902" y="409" class="step-title">Decryption and File Access</text>
  <text x="866" y="440" class="step-sub">Unwrap AES key, decrypt ciphertext,</text>
  <text x="866" y="460" class="step-sub">and view or download original PDF</text>

  <!-- Inter-zone Connectors -->
  <!-- Step 3 -> Step 4 -->
  <path d="M 348 493 L 404 493 L 404 277 L 455 277" fill="none" stroke="var(--arrow)" stroke-width="2.2" marker-end="url(#arrow-neutral)"/>

  <!-- Step 5 -> Step 6 -->
  <path d="M 740 435 L 796 435 L 796 277 L 847 277" fill="none" stroke="var(--arrow)" stroke-width="2.2" marker-end="url(#arrow-neutral)"/>

  <!-- Legend -->
  <rect x="48" y="586" width="1104" height="54" rx="8" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="76" y="618" class="legend-title">Legend (where each step runs):</text>

  <rect x="336" y="601" width="24" height="24" rx="5" fill="var(--primary-bg)" stroke="var(--primary)" stroke-width="2"/>
  <text x="370" y="618" class="legend-label">Sender's Browser (Steps 1–3)</text>

  <rect x="614" y="601" width="24" height="24" rx="5" fill="var(--server-bg)" stroke="var(--server)" stroke-width="2"/>
  <text x="648" y="618" class="legend-label">Server (Steps 4–5)</text>

  <rect x="838" y="601" width="24" height="24" rx="5" fill="var(--accent-bg)" stroke="var(--accent)" stroke-width="2"/>
  <text x="872" y="618" class="legend-label">Recipient's Browser (Steps 6–7)</text>
</svg>
</body></html>
