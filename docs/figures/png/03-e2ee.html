<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;padding:0;background:#ffffff}svg{display:block}</style></head><body><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f8fafc;
      --border: #cbd5e1;
      --text: #0f172a;
      --muted: #475569;
      --arrow: #334155;
      --primary: #1d4ed8;
      --primary-bg: #eff6ff;
      --primary-border: #93c5fd;
      --accent: #0f766e;
      --accent-bg: #f0fdfa;
      --accent-border: #5eead4;
      --server: #334155;
      --warn: #b91c1c;
      --warn-bg: #fef2f2;
      --warn-border: #fca5a5;
    }
    text {
      font-family: Inter, "Segoe UI", Helvetica, Arial, sans-serif;
      fill: var(--text);
    }
    .title { font-size: 25px; font-weight: 700; }
    .subtitle { font-size: 14px; font-weight: 400; fill: var(--muted); }
    .zone-title { font-size: 15.5px; font-weight: 700; fill: #ffffff; }
    .box-title { font-size: 14px; font-weight: 700; }
    .box-sub { font-size: 12px; font-weight: 400; fill: var(--muted); }
    .arrow-label { font-size: 12px; font-weight: 600; fill: var(--text); }
    .label-primary { fill: var(--primary); }
    .label-accent { fill: var(--accent); }
    .boundary-label { font-size: 13px; font-weight: 700; fill: var(--warn); }
    .key-pill { font-size: 12px; font-weight: 700; fill: var(--primary); }
    .key-pill-accent { font-size: 12px; font-weight: 700; fill: var(--accent); }
  </style>

  <defs>
    <marker id="arrow-primary" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrow-accent" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-neutral" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1200" height="675" fill="var(--bg)"/>

  <!-- Header -->
  <text x="48" y="46" class="title">How End-to-End Encryption Works for One Share</text>
  <text x="48" y="70" class="subtitle">The file is encrypted with a fresh AES-GCM key; only the recipient's RSA-OAEP public key wraps that AES key.</text>
  <line x1="48" y1="86" x2="1152" y2="86" stroke="var(--border)" stroke-width="1"/>

  <!-- Zone 1: Sender's Browser -->
  <rect x="48" y="108" width="412" height="516" rx="10" fill="var(--primary-bg)" stroke="var(--primary-border)" stroke-width="1.5"/>
  <path d="M 48 118 Q 48 108 58 108 L 450 108 Q 460 108 460 118 L 460 148 L 48 148 Z" fill="var(--primary)"/>
  <text x="254" y="134" text-anchor="middle" class="zone-title">Sender's Browser</text>

  <!-- Zone 2: Server Trust Boundary -->
  <rect x="482" y="108" width="236" height="516" rx="10" fill="var(--surface)" stroke="var(--warn)" stroke-width="2" stroke-dasharray="7 4"/>
  <rect x="494" y="120" width="212" height="50" rx="6" fill="var(--warn-bg)" stroke="var(--warn-border)" stroke-width="1"/>
  <text x="600" y="141" text-anchor="middle" class="boundary-label">The server never sees the</text>
  <text x="600" y="159" text-anchor="middle" class="boundary-label">plaintext file or the AES key</text>

  <!-- Zone 3: Recipient's Browser -->
  <rect x="740" y="108" width="412" height="516" rx="10" fill="var(--accent-bg)" stroke="var(--accent-border)" stroke-width="1.5"/>
  <path d="M 740 118 Q 740 108 750 108 L 1142 108 Q 1152 108 1152 118 L 1152 148 L 740 148 Z" fill="var(--accent)"/>
  <text x="946" y="134" text-anchor="middle" class="zone-title">Recipient's Browser</text>

  <!-- SENDER TRACK (Top: Plain PDF -> AES-GCM -> Ciphertext) -->
  <rect x="62" y="218" width="84" height="86" rx="8" fill="var(--warn-bg)" stroke="var(--warn)" stroke-width="1.5"/>
  <text x="104" y="254" text-anchor="middle" class="box-title">Plain PDF</text>
  <text x="104" y="276" text-anchor="middle" class="box-sub">(plaintext)</text>

  <line x1="146" y1="261" x2="168" y2="261" stroke="var(--primary)" stroke-width="2.2" marker-end="url(#arrow-primary)"/>

  <rect x="172" y="204" width="150" height="114" rx="8" fill="#ffffff" stroke="var(--primary-border)" stroke-width="1.5"/>
  <text x="247" y="230" text-anchor="middle" class="box-title">AES-GCM</text>
  <text x="247" y="248" text-anchor="middle" class="box-title">Encryption</text>
  <text x="247" y="274" text-anchor="middle" class="box-sub">Fresh 256-bit key</text>
  <text x="247" y="294" text-anchor="middle" class="box-sub">Random 96-bit IV</text>

  <line x1="322" y1="261" x2="346" y2="261" stroke="var(--primary)" stroke-width="2.2" marker-end="url(#arrow-primary)"/>

  <rect x="350" y="218" width="96" height="86" rx="8" fill="#ffffff" stroke="var(--primary-border)" stroke-width="1.5"/>
  <text x="398" y="254" text-anchor="middle" class="box-title">Ciphertext</text>
  <text x="398" y="276" text-anchor="middle" class="box-sub">(+ 96-bit IV)</text>

  <!-- SENDER KEY TRACK (AES key down -> RSA-OAEP Wrap -> Wrapped Key) -->
  <line x1="247" y1="318" x2="247" y2="394" stroke="var(--primary)" stroke-width="2.2" marker-end="url(#arrow-primary)"/>
  <rect x="190" y="343" width="114" height="22" rx="4" fill="#dbeafe"/>
  <text x="247" y="358" text-anchor="middle" class="key-pill">256-bit AES key</text>

  <rect x="172" y="398" width="150" height="108" rx="8" fill="#ffffff" stroke="var(--primary-border)" stroke-width="1.5"/>
  <text x="247" y="424" text-anchor="middle" class="box-title">RSA-OAEP Wrap</text>
  <text x="247" y="448" text-anchor="middle" class="box-sub">Encrypts AES key with</text>
  <text x="247" y="466" text-anchor="middle" class="box-sub">recipient's public key</text>

  <line x1="322" y1="452" x2="346" y2="452" stroke="var(--primary)" stroke-width="2.2" marker-end="url(#arrow-primary)"/>

  <rect x="350" y="408" width="96" height="88" rx="8" fill="#ffffff" stroke="var(--primary-border)" stroke-width="1.5"/>
  <text x="398" y="446" text-anchor="middle" class="box-title">Wrapped</text>
  <text x="398" y="464" text-anchor="middle" class="box-title">Key</text>

  <!-- SERVER BOX (Uploaded to Server) -->
  <rect x="518" y="198" width="164" height="320" rx="8" fill="#ffffff" stroke="var(--border)" stroke-width="1.5"/>
  <path d="M 518 206 Q 518 198 526 198 L 674 198 Q 682 198 682 206 L 682 232 L 518 232 Z" fill="var(--server)"/>
  <text x="600" y="220" text-anchor="middle" class="arrow-label" style="fill:#ffffff;">Uploaded to Server</text>

  <rect x="532" y="246" width="136" height="62" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="600" y="272" text-anchor="middle" class="box-title">Ciphertext</text>
  <text x="600" y="292" text-anchor="middle" class="box-sub">+ 96-bit IV</text>

  <text x="600" y="362" text-anchor="middle" class="box-sub">Stored on disk</text>
  <text x="600" y="380" text-anchor="middle" class="box-sub">(cannot decrypt)</text>

  <rect x="532" y="420" width="136" height="64" rx="6" fill="var(--surface)" stroke="var(--border)" stroke-width="1"/>
  <text x="600" y="448" text-anchor="middle" class="box-title">Wrapped Key</text>
  <text x="600" y="468" text-anchor="middle" class="box-sub">RSA-OAEP blob</text>

  <!-- Arrows: Sender -> Server -->
  <line x1="446" y1="261" x2="514" y2="261" stroke="var(--primary)" stroke-width="2.2" marker-end="url(#arrow-primary)"/>
  <rect x="458" y="232" width="48" height="20" rx="4" fill="#ffffff"/>
  <text x="482" y="246" text-anchor="middle" class="arrow-label label-primary">upload</text>

  <line x1="446" y1="452" x2="514" y2="452" stroke="var(--primary)" stroke-width="2.2" marker-end="url(#arrow-primary)"/>
  <rect x="458" y="423" width="48" height="20" rx="4" fill="#ffffff"/>
  <text x="482" y="437" text-anchor="middle" class="arrow-label label-primary">upload</text>

  <!-- Arrows: Server -> Recipient -->
  <line x1="682" y1="261" x2="862" y2="261" stroke="var(--accent)" stroke-width="2.2" marker-end="url(#arrow-accent)"/>
  <rect x="708" y="226" width="134" height="32" rx="4" fill="#ffffff"/>
  <text x="775" y="240" text-anchor="middle" class="arrow-label label-accent">back to recipient's</text>
  <text x="775" y="254" text-anchor="middle" class="arrow-label label-accent">browser</text>

  <line x1="682" y1="452" x2="862" y2="452" stroke="var(--accent)" stroke-width="2.2" marker-end="url(#arrow-accent)"/>
  <rect x="720" y="424" width="110" height="22" rx="4" fill="#ffffff"/>
  <text x="775" y="439" text-anchor="middle" class="arrow-label label-accent">wrapped key</text>

  <!-- RECIPIENT TRACK -->
  <rect x="866" y="204" width="150" height="114" rx="8" fill="#ffffff" stroke="var(--accent-border)" stroke-width="1.5"/>
  <text x="941" y="232" text-anchor="middle" class="box-title">Decrypt</text>
  <text x="941" y="250" text-anchor="middle" class="box-title">(AES-GCM)</text>
  <text x="941" y="276" text-anchor="middle" class="box-sub">Uses unwrapped AES</text>
  <text x="941" y="294" text-anchor="middle" class="box-sub">key + 96-bit IV</text>

  <rect x="866" y="398" width="150" height="108" rx="8" fill="#ffffff" stroke="var(--accent-border)" stroke-width="1.5"/>
  <text x="941" y="424" text-anchor="middle" class="box-title">Unwrap with</text>
  <text x="941" y="442" text-anchor="middle" class="box-title">Private Key</text>
  <text x="941" y="468" text-anchor="middle" class="box-sub">RSA-OAEP key loaded</text>
  <text x="941" y="486" text-anchor="middle" class="box-sub">from IndexedDB</text>

  <!-- Unwrapped AES key goes UP into Decrypt -->
  <line x1="941" y1="398" x2="941" y2="322" stroke="var(--accent)" stroke-width="2.2" marker-end="url(#arrow-accent)"/>
  <rect x="884" y="347" width="114" height="22" rx="4" fill="#ccfbf1"/>
  <text x="941" y="362" text-anchor="middle" class="key-pill-accent">256-bit AES key</text>

  <!-- Decrypt -> Original PDF -->
  <line x1="1016" y1="261" x2="1044" y2="261" stroke="var(--accent)" stroke-width="2.2" marker-end="url(#arrow-accent)"/>

  <rect x="1048" y="218" width="90" height="86" rx="8" fill="#ffffff" stroke="var(--accent)" stroke-width="2"/>
  <text x="1093" y="250" text-anchor="middle" class="box-title">Original</text>
  <text x="1093" y="268" text-anchor="middle" class="box-title">PDF</text>
  <text x="1093" y="290" text-anchor="middle" class="box-sub">(restored)</text>

  <!-- Bottom note inside zones -->
  <text x="254" y="562" text-anchor="middle" class="box-sub">Plaintext &amp; AES key stay inside sender's browser</text>
  <text x="600" y="562" text-anchor="middle" class="box-sub">No private keys, no plaintext</text>
  <text x="946" y="562" text-anchor="middle" class="box-sub">Only the intended recipient can decrypt</text>
</svg>
</body></html>
