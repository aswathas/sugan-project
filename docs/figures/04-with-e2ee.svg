<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" viewBox="0 0 1200 675"><style>:root{--bg:#ffffff;--surface:#f8fafc;--border:#cbd5e1;--text:#0f172a;--muted:#475569;--arrow:#334155;--primary:#1d4ed8;--primary-bg:#eff6ff;--primary-border:#93c5fd;--accent:#0f766e;--accent-bg:#f0fdfa;--accent-border:#5eead4;--server:#334155;--warn:#b91c1c;--warn-bg:#fef2f2;--warn-border:#fca5a5}text{font-family:Inter,&quot;Segoe UI&quot;,Helvetica,Arial,sans-serif;fill:var(--text)}.title{font-size:25px;font-weight:700}.subtitle{font-size:14px;font-weight:400;fill:var(--muted)}.col-header{font-size:16px;font-weight:700;fill:#fff}.box-title{font-size:15px;font-weight:700}.box-sub{font-size:13px;font-weight:400;fill:var(--muted)}.arrow-accent-label,.arrow-primary-label{font-size:13.5px;font-weight:700}.arrow-primary-label{fill:var(--primary)}.warn-title{font-weight:700}.arrow-accent-label{fill:var(--accent)}.warn-title{font-size:15px;fill:var(--warn)}.safe-sub,.status-text{font-size:13px;font-weight:600;fill:var(--accent)}.status-text{font-size:13.5px}</style><defs><marker id="arrow-primary" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path fill="#1d4ed8" d="M 1 1.5 L 9 5 L 1 8.5 z"/></marker><marker id="arrow-accent" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path fill="#0f766e" d="M 1 1.5 L 9 5 L 1 8.5 z"/></marker><marker id="arrow-warn" markerHeight="10" markerWidth="10" orient="auto" refX="8" refY="5"><path fill="#b91c1c" d="M 1 1.5 L 9 5 L 1 8.5 z"/></marker></defs><rect width="1200" height="675" x="0" y="0" fill="var(--bg)"/><text x="48" y="46" class="title">Proposed File Sharing (With End-to-End Encryption)</text><text x="48" y="70" class="subtitle">Encryption and decryption occur only in the browsers; the server stores ciphertext and cannot read the file.</text><line x1="48" x2="1152" y1="86" y2="86" stroke="var(--border)" stroke-width="1"/><rect width="1104" height="38" x="48" y="106" fill="var(--accent-bg)" stroke="var(--accent-border)" stroke-width="1.5" rx="8"/><text x="600" y="130" class="status-text" text-anchor="middle">Protected by Design: Only the recipient&apos;s private key can unwrap the AES key and decrypt the file</text><rect width="250" height="220" x="64" y="200" fill="var(--primary-bg)" stroke="var(--primary-border)" stroke-width="1.5" rx="10"/><path fill="var(--primary)" d="M 64 210 Q 64 200 74 200 L 304 200 Q 314 200 314 210 L 314 242 L 64 242 Z"/><text x="189" y="227" class="col-header" text-anchor="middle">Sender&apos;s Browser</text><rect width="210" height="84" x="84" y="268" fill="#fff" stroke="var(--primary-border)" stroke-width="1.5" rx="8"/><text x="189" y="295" class="box-title" text-anchor="middle">Encrypts Before Upload</text><text x="189" y="317" class="box-sub" text-anchor="middle">AES-GCM encrypts file</text><text x="189" y="336" class="box-sub" text-anchor="middle">RSA-OAEP wraps AES key</text><text x="189" y="388" class="box-sub" text-anchor="middle">Plaintext never leaves device</text><rect width="290" height="280" x="455" y="170" fill="var(--surface)" stroke="var(--border)" stroke-width="2" rx="10"/><path fill="var(--server)" d="M 455 180 Q 455 170 465 170 L 735 170 Q 745 170 745 180 L 745 212 L 455 212 Z"/><text x="600" y="197" class="col-header" text-anchor="middle">Server</text><rect width="246" height="196" x="477" y="232" fill="#fff" stroke="var(--border)" stroke-width="1.5" rx="8"/><text x="600" y="258" class="box-title" text-anchor="middle">Server Storage</text><text x="600" y="284" class="box-title" text-anchor="middle">Stores ciphertext,</text><text x="600" y="304" class="box-title" text-anchor="middle">IV, wrapped key</text><rect width="202" height="62" x="499" y="322" fill="var(--surface)" stroke="var(--border)" stroke-width="1.5" rx="6"/><text x="600" y="348" class="box-sub" text-anchor="middle">Encrypted blob + metadata</text><text x="600" y="369" class="box-sub" text-anchor="middle">No plaintext · No private key</text><text x="600" y="412" class="safe-sub" text-anchor="middle">Zero plaintext on disk</text><rect width="250" height="220" x="886" y="200" fill="var(--accent-bg)" stroke="var(--accent-border)" stroke-width="1.5" rx="10"/><path fill="var(--accent)" d="M 886 210 Q 886 200 896 200 L 1126 200 Q 1136 200 1136 210 L 1136 242 L 886 242 Z"/><text x="1011" y="227" class="col-header" text-anchor="middle">Recipient&apos;s Browser</text><rect width="210" height="84" x="906" y="268" fill="#fff" stroke="var(--accent-border)" stroke-width="1.5" rx="8"/><text x="1011" y="295" class="box-title" text-anchor="middle">Decrypts Locally</text><text x="1011" y="317" class="box-sub" text-anchor="middle">Unwraps key via IndexedDB</text><text x="1011" y="336" class="box-sub" text-anchor="middle">Decrypts ciphertext to PDF</text><text x="1011" y="388" class="box-sub" text-anchor="middle">Only recipient can read</text><line x1="314" x2="450" y1="310" y2="310" stroke="var(--primary)" stroke-width="3" marker-end="url(#arrow-primary)"/><rect width="116" height="26" x="326" y="274" fill="#fff" rx="4"/><text x="384" y="292" class="arrow-primary-label" text-anchor="middle">ciphertext only</text><line x1="745" x2="881" y1="310" y2="310" stroke="var(--accent)" stroke-width="3" marker-end="url(#arrow-accent)"/><rect width="116" height="26" x="757" y="274" fill="#fff" rx="4"/><text x="815" y="292" class="arrow-accent-label" text-anchor="middle">ciphertext only</text><rect width="290" height="92" x="455" y="544" fill="var(--warn-bg)" stroke="var(--warn)" stroke-width="2" rx="10"/><text x="600" y="576" class="warn-title" text-anchor="middle">Attacker / Unauthorized Access</text><text x="600" y="599" class="box-sub" text-anchor="middle">Server breach, insider access, or</text><text x="600" y="618" class="box-sub" text-anchor="middle">compromised storage</text><line x1="600" x2="600" y1="544" y2="460" stroke="var(--warn)" stroke-width="3" marker-end="url(#arrow-warn)"/><line x1="556" x2="644" y1="450" y2="450" stroke="var(--accent)" stroke-linecap="round" stroke-width="4"/><rect width="174" height="44" x="614" y="472" fill="var(--surface)" stroke="var(--border)" stroke-width="1" rx="6"/><text x="701" y="492" class="warn-title" text-anchor="middle">Cannot read the file</text><text x="701" y="509" class="box-sub" text-anchor="middle">Ciphertext only; no key</text></svg>